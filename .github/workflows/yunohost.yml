name: Vérifier le cycle YunoHost
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Préparer Incus isolé
        run: |
          sudo systemctl stop docker.service docker.socket || true
          sudo apt-get update
          sudo apt-get install -y incus jq lynx btrfs-progs python3-toml
          sudo incus admin init --minimal
          sudo incus remote add yunohost https://repo.yunohost.org/incus --protocol simplestreams --public
          sudo usermod -a -G incus-admin root
          sudo sysctl -w net.ipv4.ip_forward=1
          sudo iptables -I FORWARD -i incusbr0 -j ACCEPT
          sudo iptables -I FORWARD -o incusbr0 -j ACCEPT
          sudo incus image copy yunohost:yunohost/bookworm-stable/appci local: --alias yunohost-bookworm-stable-appci
      - name: Vérifier le réseau du conteneur avant les tests
        run: |
          sudo incus launch yunohost-bookworm-stable-appci network-probe
          sleep 10
          sudo incus exec network-probe -- timeout 30 curl --fail --silent --show-error --proto '=https' https://github.com -o /dev/null
          sudo incus delete network-probe --force
      - name: Installation, upgrade et sauvegarde/restauration
        run: |
          git clone --depth=1 https://github.com/YunoHost/package_check /tmp/package_check
          python3 tools/prepare_package_check.py /tmp/package_check
          python3 /tmp/package_check/lib/parse_tests_toml.py "$GITHUB_WORKSPACE" > /tmp/package_plan.json
          sudo env YNHDEV_BACKEND=incus DIST=bookworm YNH_BRANCH=stable /tmp/package_check/package_check.sh "$GITHUB_WORKSPACE"
          sudo chown -R "$USER:$USER" /tmp/package_check
          python3 tools/verify_package_report.py /tmp/package_check
      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yunohost-report
          path: |
            /tmp/package_check/results_*.json
            /tmp/package_check/full_log_*.log
            /tmp/package_plan.json
          if-no-files-found: warn
