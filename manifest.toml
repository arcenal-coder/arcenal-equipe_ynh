# Native candidate: Linux release assets and lifecycle evidence required.
packaging_format = 2
id = "arcenal_equipe"
name = "ARCenal Équipe"
description.fr = "Trois assistants métier reliés à Hermes : recrutement, documents et communication"
description.en = "Three business assistants connected to Hermes for recruitment, documents and communication"
version = "0.2.0~ynh3"
maintainers = ["ARCenal"]

[upstream]
license = "GPL-3.0-or-later"
code = "https://github.com/arcenal-coder/arcenal-equipe_ynh"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = true
sso = true
disk = "50M"
ram.build = "50M"
ram.runtime = "256M"

[install.domain]
type = "domain"

[install.path]
type = "path"
default = "/equipe"

[install.init_main_permission]
type = "group"
default = "all_users"

[resources.sources.main]
in_subdir = false
amd64.url = "https://github.com/arcenal-coder/arcenal-equipe_ynh/releases/download/v0.2.0-alpha.3/arcenal-equipe-linux-amd64.tar.gz"
amd64.sha256 = "60d393965144b9c5b5e74c423faa17fe8aa7702dc6a283d6af3fa77d99ace48d"
arm64.url = "https://github.com/arcenal-coder/arcenal-equipe_ynh/releases/download/v0.2.0-alpha.3/arcenal-equipe-linux-arm64.tar.gz"
arm64.sha256 = "c6c170cc15a75494fb6770dd0389829bf8a9aea161a5c08a2ffdb4585a8362da"

[resources.system_user]

[resources.install_dir]

[resources.data_dir]

[resources.permissions]
main.url = "/"
main.auth_header = true

[resources.permissions.recruitment]
url = "/recrutement"
additional_urls = ["/api/public/jobs", "/static"]
allowed = "visitors"
show_tile = false

[resources.permissions.mcp]
url = "/mcp"
allowed = "visitors"
show_tile = false
auth_header = false

[resources.apt]
packages = "postgresql"

[resources.database]
type = "postgresql"
