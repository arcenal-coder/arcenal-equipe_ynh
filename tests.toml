test_format = 1.0

[default]
    # Align the isolated image's test accounts with package_check's documented fixture password.
    preinstall = """
yunohost user update package_checker --change-password SuperSecretCIPassw0rd
yunohost user update ciadmin --change-password SuperSecretCIPassw0rd
"""
    [default.curl_tests]
    private_home.path = "/"
    private_home.logged_on_sso = true
    private_home.expect_title = "ARCenal Équipe"
    private_home.auto_test_assets = true

    elise.path = "/agents/elise"
    elise.logged_on_sso = true
    elise.expect_content = "Pipeline candidats"

    mcp_connection.path = "/agents/elise"
    mcp_connection.logged_on_sso = true
    mcp_connection.expect_content = "Créer un jeton pour Hermes"

    recruitment.path = "/recrutement"
    recruitment.expect_content = "Nos offres d’emploi"

    private_api.path = "/api/recruitment"
    private_api.logged_on_sso = true
    private_api.expect_content = "arcenal"
