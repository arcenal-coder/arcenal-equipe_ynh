#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {
    client_max_body_size 8m;
    proxy_pass http://unix:/run/__APP__/app.sock;
    proxy_set_header Host $host;
    proxy_set_header X-ARCenal-Proxy "__PROXY_KEY__";
    # SSOwat clears browser-supplied YNH_* headers and sets these after authorization.
    proxy_set_header YNH_USER $http_ynh_user;
    proxy_set_header YNH_USER_FULLNAME $http_ynh_user_fullname;
    # Standard MCP clients authenticate with a bearer credential issued by the app.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "close";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 130s;
}
